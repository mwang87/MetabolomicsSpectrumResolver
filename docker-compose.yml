version: '3'
services:
  metabolomicsusi-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metabolomicsusi-web
    ports:
    - "5087:5000"
    volumes:
        - ./tmp:/app/tmp:rw
        - ./logs/:/app/logs:rw
    networks:
      - default
    restart: always
    command: /app/run_dev_server.sh
    labels:
      autoheal: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  metabolomicsusi-api1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metabolomicsusi-api1
    ports:
    - "5088:5000"
    volumes:
        - ./tmp:/app/tmp:rw
        - ./logsapi/:/app/logs:rw
    networks:
      - default
    restart: always
    command: /app/run_dev_server.sh
    labels:
      autoheal: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  metabolomicsusi-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metabolomicsusi-worker
    volumes:
      - ./tmp:/app/tmp:rw
      - ./logs:/app/logs:rw
    command: /app/run_worker.sh
    restart: always
    depends_on:
      - metabolomicsusi-redis
    networks:
      - default
      - nginx-net

  metabolomicsusi-redis:
    container_name: metabolomicsusi-redis
    #image: valkey/valkey:alpine3.20
    image: redis:alpine
    networks:
      - default
    restart: always

networks:
  nginx-net:
    external:
      name: nginx-net

